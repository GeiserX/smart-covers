name: Docs

# Builds the documentation site and publishes it, together with the Jellyfin
# plugin catalog, to GitHub Pages. The repository's Pages source is "GitHub
# Actions" (`gh api repos/GeiserX/smart-covers/pages` reports
# build_type: workflow).
#
# The catalog. Every Jellyfin that has this repository added polls
# https://geiserx.github.io/smart-covers/manifest.json. That file is the
# committed manifest.json, copied into the built site unchanged by the step
# "Add the plugin catalog to the site". This workflow replaced pages.yml, which
# published the manifest alone; the release process is unchanged: a push to
# main that edits manifest.json republishes the catalog within a minute, and a
# transient "Deployment failed, try again later" from deploy-pages only needs a
# re-run (or a workflow_dispatch), never a new release. Never deploy Pages from
# build.yml again: a second deployer replaces this artifact and takes the
# catalog down with it.
#
# Pull requests run the strict build and the catalog step, so a broken link,
# a missing page, an unreachable page or an invalid manifest fails the check
# instead of reaching the site. A push to main deploys, and only after the
# same build has passed.
#
# The site is published as a Pages artifact, never with `mkdocs gh-deploy`:
# no gh-pages branch, no `contents: write`, and one artifact is the whole site.
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
      # The catalog rides in this artifact: a manifest change must redeploy.
      - 'manifest.json'
  # No paths filter on pull requests, on purpose: a check skipped by a path
  # filter stays Pending and blocks the merge once it is a required check.
  # The build takes seconds.
  pull_request:
  workflow_dispatch:

# One run at a time per ref, in push order, never cancelled. Locking only the
# deploy job is not enough: an older push whose build finishes later would
# deploy last and publish a stale site. Pull requests get their own group.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build (strict)
    # Public repo: GitHub-hosted runners are free and unlimited here, and the
    # job runs on pull requests, so it must never touch a self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job never pushes; a persisted token is readable by pip and every MkDocs plugin.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements-docs.txt

      - name: Install dependencies
        run: pip install -r docs/requirements-docs.txt

      # mkdocs.yml sets `strict: true`; the flag here keeps the build strict
      # even if someone removes that line.
      - name: Build
        run: mkdocs build --strict

      # The committed manifest.json (full version history) is the single
      # source of truth for the catalog. It is not a page: MkDocs builds docs/
      # only and must not have produced this file (second line). The copy must
      # be the committed file byte for byte (fourth line). Invalid JSON fails
      # the job rather than publishing a broken catalog (first line).
      - name: Add the plugin catalog to the site
        run: |
          python3 -c "import json; json.load(open('manifest.json'))"
          test ! -e site/manifest.json
          cp manifest.json site/manifest.json
          cmp manifest.json site/manifest.json
          touch site/.nojekyll

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    # Runs on push to main only, after the build job has passed.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
