name: Publish catalog manifest to Pages

# Publishes the committed manifest.json (the Jellyfin plugin catalog that users
# add as a repository) to GitHub Pages. This is deliberately DECOUPLED from the
# release workflow: the release job used to deploy Pages inline, so a transient
# "Deployment failed, try again later" from actions/deploy-pages stranded the
# catalog on the previous version until the *next* release (that is exactly how
# v7.3.2.0 shipped as a release but the catalog kept advertising 7.3.1.0 →
# NotSupported for installers). Here a manifest change — or a manual dispatch —
# republishes on its own, and a transient failure just needs a re-run.
on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; let an in-flight one finish rather than
# cancel it (a cancelled deploy can leave the site on a stale version).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # This job only reads manifest.json and deploys Pages; it never pushes
          # back, so don't leave the GITHUB_TOKEN git credential on disk.
          persist-credentials: false

      - name: Assemble site from the committed manifest
        run: |
          # The committed manifest.json (full version history) is the single
          # source of truth for the catalog. Fail loudly if it is not valid JSON
          # rather than publish a broken catalog.
          python3 -c "import json; json.load(open('manifest.json'))"
          mkdir -p _site
          cp manifest.json _site/manifest.json
          # Serve files verbatim (no Jekyll processing of the repo).
          touch _site/.nojekyll
          mkdir -p _site/images
          cp docs/images/banner.svg _site/images/banner.svg
          cp docs/images/icon.svg _site/images/icon.svg
          cat > _site/index.html << 'HTML'
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>smart-covers: Jellyfin plugin catalog</title>
          <link rel="icon" href="images/icon.svg">
          <style>
            body { margin: 0; background: #1d1428; color: #f3ead8; font: 17px/1.5 system-ui, sans-serif; }
            main { max-width: 900px; margin: 0 auto; padding: 32px 20px 64px; }
            img { width: 100%; height: auto; display: block; border-radius: 18px; }
            code { display: block; margin: 8px 0 20px; padding: 14px 16px; background: #2a1e3a; color: #fff;
                   border-radius: 8px; font-size: 16px; overflow-x: auto; user-select: all; }
            a { color: #c7b6d6; }
          </style>
          <main>
            <img src="images/banner.svg" alt="smart-covers">
            <p>Every book, comic and audiobook in Jellyfin gets a cover. Add this catalog under
               <strong>Dashboard &gt; Plugins &gt; Repositories</strong>, then install <strong>SmartCovers</strong>:</p>
            <code>https://geiserx.github.io/smart-covers/manifest.json</code>
            <p>Install steps, settings and troubleshooting:
               <a href="https://github.com/GeiserX/smart-covers#readme">github.com/GeiserX/smart-covers</a></p>
          </main>
          </html>
          HTML

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
